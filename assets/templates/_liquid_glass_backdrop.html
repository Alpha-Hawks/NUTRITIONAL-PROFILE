{% comment %}
Backdrop layers + the displacement filter the card rim refracts through.
Include as the first thing inside a .lg-scope section.
{% endcomment %}
<div class="lg-bg" aria-hidden="true"></div>
<div class="lg-scrim" aria-hidden="true"></div>
<div class="lg-orb lg-orb--lime" aria-hidden="true"></div>
<div class="lg-orb lg-orb--chili" aria-hidden="true"></div>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="lgLiquid" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2.2" result="sn"/>
    <feDisplacementMap in="SourceGraphic" in2="sn" scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
