{% load static %}
{# Fonts + stylesheet + behaviour for the liquid glass auth pages. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter+Tight:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/liquid-glass.css' %}?v=20260907_12">
<script src="{% static 'js/liquid-glass.js' %}?v=20260907_12" defer></script>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute; pointer-events:none;">
  <filter id="lgLiquid" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2.2" result="sn"/>
    <feDisplacementMap in="SourceGraphic" in2="sn" scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
